blueprint:
  name: Haier BWWP – PV-Überschuss / PV surplus
  description: >
    Steuert die Solltemperatur der Haier-Brauchwasserwärmepumpe dreistufig nach
    dem *verfügbaren* Solarstrom (= PV-Überschuss + aktuelle BWWP-Aufnahme).
    Diese Größe ist unabhängig davon, ob die WP gerade läuft, und verhindert so
    das Pendeln an der Wurzel.

    Hochschalten erfolgt, sobald der verfügbare Solarstrom die erwartete
    Leistungsaufnahme (+ Puffer) deckt; zurückgeschaltet wird erst, wenn er um
    die Netz-Toleranz darunter fällt (Hysterese). Die WP startet/stoppt selbst
    anhand der Solltemperatur – diese Automation setzt nur das Ziel.

    Anti-Takt-Schutz: Ein NEUER Zyklus wird nur gestartet, wenn der Verdichter
    schon min_off_time aus war. Läuft er bereits, wird die Zielstufe verlängert
    (Piggyback) – kein unnötiger Mehrfachstart bei wechselhaftem Himmel.

    Controls the Haier DHW heat pump's target temperature in three tiers based
    on *available* solar power (= PV surplus + current heat-pump draw). That
    figure is independent of whether the pump is running, killing oscillation at
    the root. Up-shift when available solar covers the expected draw (+ buffer);
    down-shift only once it drops below by the grid-tolerance (hysteresis).
  domain: automation
  author: st03psn
  source_url: https://github.com/st03psn/haier-modbus/blob/main/blueprints/automation/haier_modbus/pv_surplus.yaml
  input:
    pv_surplus_sensor:
      name: PV-Überschuss-Sensor (W)
      description: Sensor mit dem aktuellen PV-Überschuss / der Netzeinspeisung in Watt.
      selector:
        entity:
          domain: sensor
          device_class: power
    bwwp_power_sensor:
      name: BWWP-Leistungssensor (W)
      description: >
        Aktuelle Leistungsaufnahme der BWWP (z. B. Shelly). Wird zum
        PV-Überschuss addiert, um den *verfügbaren* Solarstrom zu bestimmen –
        diese Summe springt nicht, wenn die WP ein-/ausschaltet.
      selector:
        entity:
          domain: sensor
          device_class: power
    target_number:
      name: Solltemperatur (number)
      description: Die "Solltemperatur"-Entität der Haier-BWWP-Integration (Reg 6).
      selector:
        entity:
          domain: number
    water_temp_sensor:
      name: Wassertemperatur-Sensor
      description: Aktuelle Speicher-/Wassertemperatur (z. B. sensor.haier_hwhp_water_temp).
      selector:
        entity:
          domain: sensor
          device_class: temperature
    wp_status_binary:
      name: WP-Status (binary_sensor)
      description: >
        Binärsensor, der angibt, ob der Verdichter gerade läuft (on = läuft).
        Für den Anti-Takt-Schutz: ein neuer Zyklus wird nur gestartet, wenn die
        WP schon min_off_time aus ist; läuft sie bereits, wird die Zielstufe
        immer verlängert (Piggyback) statt neu gestartet.
      selector:
        entity:
          domain: binary_sensor
    max_draw:
      name: Max. Leistungsaufnahme der WP (W)
      description: >
        Maximale Verdichter-Aufnahme ohne Heizstab. Referenz für das
        Hoch-/Rückschalten auf die Normalstufe.
      default: 550
      selector:
        number: { min: 100, max: 3000, step: 10, unit_of_measurement: W, mode: box }
    buffer_on:
      name: Puffer zum Hochschalten (W)
      description: >
        Solar-Reserve über der erwarteten Aufnahme, bevor auf die Normalstufe
        hochgeschaltet wird. Hochschalten ab: verfügbar ≥ max_draw + Puffer.
      default: 50
      selector:
        number: { min: 0, max: 1000, step: 10, unit_of_measurement: W, mode: box }
    grid_tolerance:
      name: Tolerierter Netzbezug zum Rückschalten (W)
      description: >
        Wie weit der verfügbare Solarstrom unter die Aufnahme fallen darf, bevor
        auf Grundtemperatur zurückgeschaltet wird. Rückschalten ab:
        verfügbar < max_draw − Toleranz. Differenz zum Hochschalten = Hysterese.
      default: 200
      selector:
        number: { min: 0, max: 2000, step: 10, unit_of_measurement: W, mode: box }
    high_avail:
      name: Schwelle Hochtemperatur (verfügbar, W)
      description: Ab diesem verfügbaren Solarstrom wird auf die Hochstufe (z. B. 70 °C) gesetzt.
      default: 1500
      selector:
        number: { min: 0, max: 10000, step: 50, unit_of_measurement: W, mode: box }
    high_hysteresis:
      name: Rückschalt-Hysterese Hochtemperatur (W)
      description: Hoch→Normal, sobald verfügbar < high_avail − diese Hysterese.
      default: 400
      selector:
        number: { min: 0, max: 5000, step: 50, unit_of_measurement: W, mode: box }
    temp_high:
      name: Zieltemperatur Hochstufe (°C)
      default: 70
      selector:
        number: { min: 35, max: 75, step: 1, unit_of_measurement: "°C", mode: slider }
    temp_normal:
      name: Zieltemperatur Normalstufe (°C)
      default: 65
      selector:
        number: { min: 35, max: 75, step: 1, unit_of_measurement: "°C", mode: slider }
    temp_base:
      name: Grund-Zieltemperatur (°C)
      default: 50
      selector:
        number: { min: 35, max: 75, step: 1, unit_of_measurement: "°C", mode: slider }
    debounce:
      name: Entprellzeit (Minuten)
      description: Wie lange eine Schwelle gehalten sein muss, bevor reagiert wird.
      default: 5
      selector:
        number: { min: 0, max: 60, step: 1, unit_of_measurement: min, mode: box }
    min_off_time:
      name: Mindest-Stillstand vor Neustart (Minuten)
      description: >
        Anti-Takt-Schutz: So lange muss der Verdichter aus gewesen sein, bevor
        ein NEUER PV-Zyklus gestartet wird. Läuft die WP bereits, greift der
        Schutz nicht (die Stufe wird dann verlängert, Piggyback).
      default: 30
      selector:
        number: { min: 0, max: 240, step: 5, unit_of_measurement: min, mode: box }
    notify_target:
      name: Benachrichtigungsdienst (optional)
      description: notify-Dienst für Statusmeldungen, z. B. notify.mobile_app_xyz. Leer = aus.
      default: ""

mode: single
max_exceeded: silent

# Entity-IDs und Zahlen für die Template-Trigger. trigger_variables ist der
# einzige Ort, an dem !input zuverlässig in Trigger-Templates einsetzbar ist.
trigger_variables:
  t_pv: !input pv_surplus_sensor
  t_bwwp: !input bwwp_power_sensor
  t_max_draw: !input max_draw
  t_buffer_on: !input buffer_on
  t_grid_tol: !input grid_tolerance
  t_high_avail: !input high_avail
  t_high_hyst: !input high_hysteresis

variables:
  v_pv: !input pv_surplus_sensor
  v_bwwp: !input bwwp_power_sensor
  v_target_number: !input target_number
  v_water_sensor: !input water_temp_sensor
  v_max_draw: !input max_draw
  v_buffer_on: !input buffer_on
  v_high_avail: !input high_avail
  v_temp_high: !input temp_high
  v_temp_normal: !input temp_normal
  v_temp_base: !input temp_base
  v_notify: !input notify_target
  verfuegbar: "{{ (states(v_pv) | float(0)) + (states(v_bwwp) | float(0)) }}"
  water: "{{ states(v_water_sensor) | float(0) }}"
  on65: "{{ v_max_draw + v_buffer_on }}"
  on70: "{{ v_high_avail }}"
  # Gewünschte Stufe bei Neustart (Kaltbewertung, ohne Hysterese)
  desired_start: >
    {% if verfuegbar >= (on70 | float) %}{{ v_temp_high }}
    {% elif verfuegbar >= (on65 | float) %}{{ v_temp_normal }}
    {% else %}{{ v_temp_base }}{% endif %}

trigger:
  # Hochstufe: verfügbar ≥ high_avail
  - platform: template
    value_template: >
      {{ (states(t_pv) | float(0)) + (states(t_bwwp) | float(0))
         >= (t_high_avail | float) }}
    for: { minutes: !input debounce }
    id: hoch
  # Normalstufe hoch: verfügbar ≥ max_draw + Puffer
  - platform: template
    value_template: >
      {{ (states(t_pv) | float(0)) + (states(t_bwwp) | float(0))
         >= (t_max_draw | float) + (t_buffer_on | float) }}
    for: { minutes: !input debounce }
    id: an
  # Hoch→Normal: verfügbar < high_avail − Hysterese
  - platform: template
    value_template: >
      {{ (states(t_pv) | float(0)) + (states(t_bwwp) | float(0))
         < (t_high_avail | float) - (t_high_hyst | float) }}
    for: { minutes: !input debounce }
    id: sinkt
  # Normal→Grund: verfügbar < max_draw − Netz-Toleranz
  - platform: template
    value_template: >
      {{ (states(t_pv) | float(0)) + (states(t_bwwp) | float(0))
         < (t_max_draw | float) - (t_grid_tol | float) }}
    for: { minutes: !input debounce }
    id: ab
  # HA-Neustart: passende Stufe herstellen
  - platform: homeassistant
    event: start
    id: start

condition: []

action:
  - choose:
      # ── Hochstufe (z. B. 70 °C) ────────────────────────────────────────
      - conditions:
          - condition: trigger
            id: hoch
          - condition: not
            conditions:
              - condition: state
                entity_id: !input water_temp_sensor
                state: ["unavailable", "unknown"]
          - condition: numeric_state
            entity_id: !input water_temp_sensor
            below: "{{ v_temp_high - 2 }}"
          - condition: numeric_state
            entity_id: !input target_number
            below: "{{ v_temp_high }}"
          # Anti-Takt: läuft die WP, verlängern (Piggyback); ist sie aus,
          # nur starten, wenn sie schon min_off_time aus war.
          - condition: or
            conditions:
              - condition: state
                entity_id: !input wp_status_binary
                state: "on"
              - condition: state
                entity_id: !input wp_status_binary
                state: "off"
                for: { minutes: !input min_off_time }
        sequence:
          - action: number.set_value
            target:
              entity_id: !input target_number
            data:
              value: "{{ v_temp_high | float }}"
          - choose:
              - conditions: "{{ v_notify | length > 0 }}"
                sequence:
                  - action: "{{ v_notify }}"
                    data:
                      title: "BWWP Ziel {{ v_temp_high | int }}°C"
                      message: >
                        Viel Solar ({{ verfuegbar | int }} W verfügbar) –
                        Speicher {{ water | int }}°C, Ziel {{ v_temp_high | int }}°C.

      # ── Normalstufe hoch (z. B. 65 °C) ─────────────────────────────────
      - conditions:
          - condition: trigger
            id: an
          - condition: not
            conditions:
              - condition: state
                entity_id: !input water_temp_sensor
                state: ["unavailable", "unknown"]
          - condition: numeric_state
            entity_id: !input water_temp_sensor
            below: "{{ v_temp_normal - 2 }}"
          - condition: numeric_state
            entity_id: !input target_number
            below: "{{ v_temp_normal }}"
          # Anti-Takt: läuft die WP, verlängern (Piggyback); ist sie aus,
          # nur starten, wenn sie schon min_off_time aus war.
          - condition: or
            conditions:
              - condition: state
                entity_id: !input wp_status_binary
                state: "on"
              - condition: state
                entity_id: !input wp_status_binary
                state: "off"
                for: { minutes: !input min_off_time }
        sequence:
          - action: number.set_value
            target:
              entity_id: !input target_number
            data:
              value: "{{ v_temp_normal | float }}"
          - choose:
              - conditions: "{{ v_notify | length > 0 }}"
                sequence:
                  - action: "{{ v_notify }}"
                    data:
                      title: "BWWP Ziel {{ v_temp_normal | int }}°C"
                      message: >
                        Solarüberschuss ({{ verfuegbar | int }} W verfügbar) –
                        Speicher {{ water | int }}°C, Ziel {{ v_temp_normal | int }}°C.

      # ── Hoch→Normal (Solar sinkt) ──────────────────────────────────────
      - conditions:
          - condition: trigger
            id: sinkt
          - condition: numeric_state
            entity_id: !input target_number
            above: "{{ v_temp_high - 1 }}"
        sequence:
          - action: number.set_value
            target:
              entity_id: !input target_number
            data:
              value: "{{ v_temp_normal | float }}"
          - choose:
              - conditions: "{{ v_notify | length > 0 }}"
                sequence:
                  - action: "{{ v_notify }}"
                    data:
                      title: "BWWP Ziel {{ v_temp_normal | int }}°C"
                      message: >
                        Solar gesunken ({{ verfuegbar | int }} W) –
                        zurück auf {{ v_temp_normal | int }}°C.

      # ── Normal→Grund (kein nutzbarer Überschuss mehr) ──────────────────
      - conditions:
          - condition: trigger
            id: ab
          - condition: numeric_state
            entity_id: !input target_number
            above: "{{ v_temp_base }}"
        sequence:
          - action: number.set_value
            target:
              entity_id: !input target_number
            data:
              value: "{{ v_temp_base | float }}"
          - choose:
              - conditions: "{{ v_notify | length > 0 }}"
                sequence:
                  - action: "{{ v_notify }}"
                    data:
                      title: "BWWP Ziel {{ v_temp_base | int }}°C"
                      message: >
                        Kein nutzbarer Überschuss ({{ verfuegbar | int }} W) –
                        Grundtemperatur {{ v_temp_base | int }}°C.

      # ── Neustart: passende Stufe setzen ────────────────────────────────
      - conditions:
          - condition: trigger
            id: start
          - condition: template
            value_template: "{{ (desired_start | float) != (states(v_target_number) | float(0)) }}"
        sequence:
          - action: number.set_value
            target:
              entity_id: !input target_number
            data:
              value: "{{ desired_start | float }}"
