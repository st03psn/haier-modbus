reset_energy_statistics:
  name: Energie-Statistik zurücksetzen
  description: >-
    Löscht die Langzeitstatistik der Gesamt-Zähler (Wärme erzeugt gesamt /
    Stromverbrauch gesamt) sowie der geräteseitigen Jahreszähler und baut sie
    ab dem aktuellen Wert sauber neu auf. Nötig, falls die Energie-Diagramme
    einen einmaligen Ausreißer zeigen (z. B. aus einem alten Baseline-Sprung
    oder nach Ändern der Register-Skalierung). Reset / Resets the long-term
    statistics of the total counters and the device-side yearly counters and
    rebuilds them cleanly from the current value.
