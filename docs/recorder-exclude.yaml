# Recorder-Ausschlüsse für die Haier-BWWP-Integration
# -----------------------------------------------------
# Reduziert DB-Wachstum bei kurzem Abfrageintervall (z. B. 5 s), indem
# Entitäten ohne Historien-Mehrwert nicht aufgezeichnet werden.
#
# Einbau: in die configuration.yaml übernehmen (vorhandenen recorder:-Block
# ggf. zusammenführen), dann Home Assistant neu starten.
# Alle Entitäten der Integration heißen <domain>.haier_hwhp_<key>.

recorder:
  exclude:
    entities:
      - binary_sensor.haier_hwhp_connection  # Connectivity – flattert beim Polling
      - sensor.haier_hwhp_mode_text          # redundant zum Modus-Select
      - sensor.haier_hwhp_hotwater_pct       # ändert sich oft, geringer Analysewert
      - sensor.haier_hwhp_target_temp        # spiegelt meist die Solltemperatur
