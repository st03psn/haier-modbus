# JAZ-/COP-Vergleichskarte für die Haier-BWWP-Integration
# ------------------------------------------------------
# Voraussetzung: HACS-Frontend-Karte "ApexCharts Card" (custom:apexcharts-card).
# Rendert die archivierten Jahres-JAZ (Balken) und Monats-COP (Linie) aus den
# Entitäts-Attributen `jaz_per_year` bzw. `cop_per_month`.
#
# WICHTIG: Entity-IDs ggf. an deine Instanz anpassen:
#   - Jahres-JAZ:  Attribut jaz_per_year  am  "JAZ (Jahr)"-Sensor
#   - Monats-COP:  Attribut cop_per_month am  "COP (Monat)"-Sensor
# (In dieser Instanz: …cop_dieses_jahr bzw. …cop_monat – Slugs können abweichen.)

type: custom:apexcharts-card
header:
  show: true
  title: Haier BWWP – JAZ / COP
graph_span: 3y
span:
  end: year
series:
  - entity: sensor.haier_brauchwasserwarmepumpe_cop_dieses_jahr
    name: JAZ pro Jahr
    type: column
    data_generator: |
      return Object.entries(entity.attributes.jaz_per_year || {})
        .map(([y, v]) => [new Date(Number(y), 0, 1).getTime(), v.cop]);
  - entity: sensor.heizungskeller_haier_bwwp_cop_monat
    name: COP pro Monat
    type: line
    curve: smooth
    data_generator: |
      return Object.entries(entity.attributes.cop_per_month || {})
        .map(([k, v]) => {
          const p = k.split('-');
          return [new Date(Number(p[0]), Number(p[1]) - 1, 1).getTime(), v.cop];
        });
yaxis:
  - min: 0
    decimals: 2
